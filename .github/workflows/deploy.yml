name: Build and deploy to Azure Container App

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: mypickup-django

jobs:
  build-and-deploy:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container App
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          POSTGRES_HOST=$(az postgres flexible-server list \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query "[0].fullyQualifiedDomainName" -o tsv)

          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars \
              DJANGO_DEBUG=False \
              DJANGO_ALLOWED_HOSTS="$FQDN" \
              DJANGO_CSRF_TRUSTED_ORIGINS="https://$FQDN" \
              MEDIA_ROOT_PATH=/mnt/media \
              DJANGO_SECRET_KEY=secretref:django-secret-key \
              EMAIL_USER=secretref:email-user \
              EMAIL_PASS=secretref:email-pass \
              POSTGRES_HOST="$POSTGRES_HOST" \
              POSTGRES_DB=mypickup \
              POSTGRES_USER=mypickupadmin \
              POSTGRES_PASSWORD=secretref:postgres-password
